<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>생합성 경로 연습장</title>
<meta name="theme-color" content="#F1F4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="대사 연습장">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.offline-badge{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font:12px/1.3 system-ui,sans-serif;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--muted);border:1px solid var(--rule);opacity:.95}
</style>
</head>
<body>
<style>
/* Layout: one-column workbook. Module switcher → view tabs → the active drill.
   Pathway steps run down a numbered rail like a wall-chart; each module keeps its own pathway colour. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --soft:#E6ECEA; --ink:#15212A; --muted:#56666D; --rule:#D2DBD9;
  --ok:#23704A; --ok-bg:#E1F1E7; --bad:#AE3530; --bad-bg:#F7E3E1;
  --m-ser:#2C8556; --m-one:#BC5D18; --m-met:#937107; --m-pyr:#2A67AA; --m-pur:#AF3838; --m-mix:#4B5B64; --m-ppp:#0E7882; --m-fa:#963A7E; --m-chol:#4A4FAE; --m-neaa:#5A7A1C; --m-urea:#8A5838; --m-glyc:#A6421F; --m-tca:#1F6E8C; --m-oxphos:#7B3FA0; --m-fao:#A8730E; --m-ketone:#3E7D5E; --m-gng:#4F6FA8; --m-glycogen:#86661C; --m-tag:#A23B5C; --m-eico:#BA4528; --m-steroid:#6A5A9E; --m-aacat:#3F7A3A; --m-aader:#8A4F9C; --m-heme:#A8322F; --m-nucdeg:#56697F;
  --s-asp:#2A67AA; --s-gly:#2C8556; --s-gln:#7A4DAE; --s-co2:#5F6C7D; --s-fthf:#BC5D18; --on-src:#FFFFFF;
  --f-display:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161A; --surface:#162026; --soft:#1E2A31; --ink:#E3EBEB; --muted:#98A9AF; --rule:#2B3A41;
    --ok:#7FD3A2; --ok-bg:#16322A; --bad:#F2928B; --bad-bg:#3A1F1E;
    --m-ser:#6FCB98; --m-one:#F0A061; --m-met:#E2C14F; --m-pyr:#7FB1EC; --m-pur:#F08C82; --m-mix:#A9B8BF; --m-ppp:#5CC6CF; --m-fa:#E58ACB; --m-chol:#A3A7F2; --m-neaa:#B2D36A; --m-urea:#DDA27F; --m-glyc:#F29A7A; --m-tca:#74C0E0; --m-oxphos:#C79AE6; --m-fao:#EBC060; --m-ketone:#86CFAA; --m-gng:#9DB6EA; --m-glycogen:#D9B866; --m-tag:#F08FAE; --m-eico:#F59A80; --m-steroid:#B7A8EC; --m-aacat:#8FD08A; --m-aader:#D6A0E6; --m-heme:#F28B85; --m-nucdeg:#A9BCD3;
    --s-asp:#7FB1EC; --s-gly:#6FCB98; --s-gln:#BD98EA; --s-co2:#A7B3C2; --s-fthf:#F0A061; --on-src:#0F161A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161A; --surface:#162026; --soft:#1E2A31; --ink:#E3EBEB; --muted:#98A9AF; --rule:#2B3A41;
  --ok:#7FD3A2; --ok-bg:#16322A; --bad:#F2928B; --bad-bg:#3A1F1E;
  --m-ser:#6FCB98; --m-one:#F0A061; --m-met:#E2C14F; --m-pyr:#7FB1EC; --m-pur:#F08C82; --m-mix:#A9B8BF; --m-ppp:#5CC6CF; --m-fa:#E58ACB; --m-chol:#A3A7F2; --m-neaa:#B2D36A; --m-urea:#DDA27F; --m-glyc:#F29A7A; --m-tca:#74C0E0; --m-oxphos:#C79AE6; --m-fao:#EBC060; --m-ketone:#86CFAA; --m-gng:#9DB6EA; --m-glycogen:#D9B866; --m-tag:#F08FAE; --m-eico:#F59A80; --m-steroid:#B7A8EC; --m-aacat:#8FD08A; --m-aader:#D6A0E6; --m-heme:#F28B85; --m-nucdeg:#A9BCD3;
  --s-asp:#7FB1EC; --s-gly:#6FCB98; --s-gln:#BD98EA; --s-co2:#A7B3C2; --s-fthf:#F0A061; --on-src:#0F161A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:28px 72px}
@media (max-width:480px){.wrap{padding-inline:16px}}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--m, var(--ink));outline-offset:2px;border-radius:4px}

header.top{display:grid;gap:6px;margin-bottom:22px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,38px);line-height:1.2;margin:0;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:62ch}

.mods{display:grid;gap:10px;margin-bottom:28px}
.modgrp{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;align-items:center}
@media (max-width:640px){.modgrp{grid-template-columns:minmax(0,1fr)}}
.grplbl{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.modrow{display:flex;flex-wrap:wrap;gap:8px}
.mod{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;cursor:pointer;font-size:14px;line-height:1.3}
.mod .dot{width:9px;height:9px;border-radius:50%;background:var(--mc);flex:none}
.mod[aria-pressed="true"]{border-color:var(--mc);box-shadow:inset 0 0 0 1px var(--mc);font-weight:600}

.modhead{display:grid;gap:6px;margin-bottom:14px}
.modhead h2{font-family:var(--f-display);font-size:clamp(22px,3.6vw,28px);margin:0;line-height:1.25;color:var(--ink);text-wrap:balance}
.modhead h2 .code{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--m);margin-right:10px;letter-spacing:.04em;vertical-align:3px}
.modhead p{margin:0;color:var(--muted);max-width:68ch}

.views{display:flex;gap:4px;border-bottom:1px solid var(--rule);margin-bottom:22px;overflow-x:auto;scrollbar-width:thin}
.view{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 9px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14.5px}
.view[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--m);font-weight:600}

.keys{margin:0 0 22px;padding:14px 18px;background:var(--soft);border-radius:8px;display:grid;gap:4px}
.keys h3{margin:0 0 2px;font-size:13px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.keys ul{margin:0;padding-left:18px;display:grid;gap:3px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.toolbar .hint{color:var(--muted);font-size:13.5px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.switch input{accent-color:var(--m);width:16px;height:16px}

.rail{list-style:none;margin:0 0 30px;padding:0}
.step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;position:relative;padding-bottom:16px}
.step:not(:last-child)::before{content:"";position:absolute;left:19px;top:34px;bottom:0;width:2px;background:var(--rule)}
.num{width:34px;height:34px;border-radius:50%;border:2px solid var(--m);color:var(--m);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface);position:relative;z-index:1}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.rx{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;font-weight:500;font-size:15.5px}
.rx .arrow{color:var(--m);font-family:var(--f-mono)}
.enz{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.enz .sym{font-family:var(--f-mono);font-weight:600;color:var(--m);font-size:15px}
.enz .dom{font-size:13px;color:var(--ink)}
.enz .full{color:var(--muted);font-size:13.5px}
.enz .ec{font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 6px}
.reveal{justify-self:start;background:var(--soft);border:1px dashed var(--muted);border-radius:6px;padding:4px 12px;cursor:pointer;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--soft);color:var(--ink)}
.chip.loc{background:transparent;border:1px solid var(--rule);color:var(--muted)}
.chip.atom{background:transparent;border:1px solid var(--m);color:var(--m);font-family:var(--f-mono)}
.note{margin:0;color:var(--muted);font-size:13.8px}

h3.sec{font-family:var(--f-display);font-size:19px;margin:8px 0 12px;font-weight:700}
.side{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:18px}
.notes{margin:0;padding:12px 16px;border-left:3px solid var(--m);background:var(--surface);border-radius:0 8px 8px 0;color:var(--ink);font-size:14px}

/* quiz */
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;display:grid;gap:14px;max-width:720px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.qmeta .tag{color:var(--m)}
.rxq{margin:0;font-family:var(--f-mono);font-size:14.5px;background:var(--soft);padding:10px 12px;border-radius:8px;overflow-wrap:anywhere}
.q{margin:0;font-size:17px;font-weight:500;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 14px;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--m)}
.opt:disabled{cursor:default;opacity:1}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)}
.explain{padding:12px 14px;border-radius:8px;background:var(--ok-bg);font-size:14.5px}
.explain.is-bad{background:var(--bad-bg)}
.explain strong{color:var(--ok)}
.explain.is-bad strong{color:var(--bad)}
.qnav{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14.5px}
.btn.primary{background:var(--m);border-color:var(--m);color:var(--bg);font-weight:600}
.result .big{font-family:var(--f-display);font-size:40px;margin:0;font-variant-numeric:tabular-nums}
.muted{color:var(--muted);margin:0}

/* order drill */
.order{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.order{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:10px;min-width:0}
.panel h4{margin:0;font-size:13px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.seq{list-style:none;margin:0;padding:0;display:grid;gap:0}
.seq li.met{padding:7px 12px;border:1px solid var(--m);border-radius:8px;background:var(--bg)}
.seq li.via{font-family:var(--f-mono);font-size:12.5px;color:var(--m);padding:3px 0 3px 18px}
.seq .empty{color:var(--muted);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{display:grid;text-align:left;gap:0;padding:7px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);cursor:pointer;line-height:1.35}
.tok:hover{border-color:var(--m)}
.tok.shake{border-color:var(--bad);background:var(--bad-bg)}
.met .t,.tok .t{font-weight:500}
.met .f,.tok .f{font-size:12px;color:var(--muted)}
.status{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.status.done{color:var(--ok);font-weight:600}

/* atoms */
.atoms{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.ringbox{flex:1 1 300px;min-width:0;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px}
.ringbox svg{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.atompanel{flex:1 1 280px;min-width:0;display:grid;gap:12px}
svg .bond{stroke:var(--muted);stroke-width:2.2;fill:none}
svg .stub{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 3;fill:none}
svg .lbl{fill:var(--muted);font-family:var(--f-body);font-size:12px}
svg .atom circle{fill:var(--surface);stroke:var(--ink);stroke-width:1.6;cursor:pointer}
svg .atom text{fill:var(--ink);font-family:var(--f-mono);font-size:12.5px;font-weight:600;pointer-events:none}
svg .atom.cur circle{stroke:var(--m);stroke-width:3}
svg .atom.done text{fill:var(--on-src)}
svg .atom.done circle{stroke:none}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.src{display:flex;align-items:center;gap:8px;text-align:left;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);cursor:pointer}
.src .sw{width:12px;height:12px;border-radius:3px;flex:none}
.src:hover:not(:disabled){border-color:var(--m)}
.src.ok{background:var(--ok-bg);border-color:var(--ok)}
.src.bad{background:var(--bad-bg);border-color:var(--bad)}
.src:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.prompt{font-size:17px;font-weight:500;margin:0}
.prompt b{font-family:var(--f-mono);color:var(--m)}
footer.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);color:var(--muted);font-size:13px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">Metabolism drill · 24 pathways</div>
    <h1>생합성 경로 연습장</h1>
    <p class="lede">학부 생화학의 대사 경로(식물 제외)를 경로 지도로 훑고, 순서를 직접 맞추고, 효소와 개념 문제로 확인합니다. 퓨린·피리미딘은 고리의 원자가 어디서 왔는지도 맞혀 봅니다.</p>
  </header>
  <nav class="mods" id="mods" aria-label="경로 선택"></nav>
  <section id="module" aria-live="polite"></section>
  <footer class="foot">효소 번호는 EC(Enzyme Commission) 번호입니다. 필수 아미노산 합성과 질소 고정은 세균·식물 경로라 넣지 않았습니다. 퀴즈 기록은 이 브라우저에만 저장됩니다.</footer>
</div>

<script>
const SRC = {
  asp:{t:'아스파르트산', v:'--s-asp'},
  gly:{t:'글리신', v:'--s-gly'},
  gln:{t:'글루타민 (아미드 N)', v:'--s-gln'},
  co2:{t:'CO₂ / HCO₃⁻', v:'--s-co2'},
  fthf:{t:'10-포르밀-THF', v:'--s-fthf'}
};

const MODS = [
{
  id:'ser', grp:'nuc', code:'SER', title:'세린 · 글리신 · 트레오닌', short:'세린·글리신·트레오닌', color:'--m-ser',
  intro:'해당과정 중간산물 3-PG(3-phosphoglycerate)에서 세린을 만들고, 세린과 글리신을 쪼개 1탄소 단위를 얻습니다. 1탄소 대사의 입구입니다.',
  keys:['3-PG → 세린은 3단계: PHGDH(NAD⁺ 사용) · PSAT1(글루탐산 → α-KG) · PSPH',
        '세린의 β-탄소는 SHMT로, 글리신의 α-탄소는 GCS(glycine cleavage system)로 1탄소 단위가 됨',
        '사람은 트레오닌을 SDS로 분해 (TDH는 위유전자)'],
  steps:[
    {e:'PHGDH', ef:'phosphoglycerate dehydrogenase', ec:'1.1.1.95', s:'3-PG (3-phosphoglycerate)', p:'3-PHP (3-phosphohydroxypyruvate)', co:['NAD⁺ → NADH'], loc:'세포질', n:'해당과정에서 갈라지는 첫 단계이자 흐름 조절점. ER 음성 유방암과 흑색종 일부에서 유전자가 증폭돼 있습니다.'},
    {e:'PSAT1', ef:'phosphoserine aminotransferase 1', ec:'2.6.1.52', s:'3-PHP', p:'3-포스포세린 (3-phosphoserine)', co:['글루탐산 → α-KG','PLP'], loc:'세포질', n:'부산물 α-KG(α-ketoglutarate)가 TCA(tricarboxylic acid) 회로로 들어갑니다.'},
    {e:'PSPH', ef:'phosphoserine phosphatase', ec:'3.1.3.3', s:'3-포스포세린', p:'L-세린', co:['H₂O → Pi'], loc:'세포질', n:'비가역 탈인산화로 경로를 마무리합니다.'},
    {e:'SHMT1/2', ef:'serine hydroxymethyltransferase (1: 세포질, 2: 미토콘드리아)', ec:'2.1.2.1', s:'L-세린 + THF (tetrahydrofolate)', p:'글리신 + 5,10-메틸렌-THF', co:['PLP (pyridoxal phosphate)'], loc:'세포질 · 미토콘드리아', n:'세린의 β-탄소가 THF로 넘어가 1탄소 단위가 됩니다. 가역 반응이라 방향은 세포 상태가 정합니다.'},
    {e:'GCS', ef:'glycine cleavage system: GLDC(P) · AMT(T) · GCSH(H) · DLD(L)', ec:'1.4.4.2', s:'글리신 + THF', p:'CO₂ + NH₄⁺ + 5,10-메틸렌-THF', co:['NAD⁺ → NADH','PLP (GLDC)','리포산 (GCSH)'], loc:'미토콘드리아', n:'글리신의 카복실 탄소는 CO₂로, α-탄소는 1탄소 단위로 갑니다. 폐암 tumor-initiating 세포에서 GLDC가 높다는 보고가 있습니다(Zhang 2012, Cell).'}
  ],

const NS='http://www.w3.org/2000/svg';
function el(tag, props, ...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v===false||v==null) continue;
    if(k==='class') n.className=v;
    else if(k==='style') n.setAttribute('style',v);
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else n.setAttribute(k, v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; n.append(k.nodeType?k:document.createTextNode(String(k))); }
  return n;
}
function sv(tag, attrs, ...kids){
  const n=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{})) n.setAttribute(k,v);
  for(const k of kids.flat()){ if(k==null) continue; n.append(k.nodeType?k:document.createTextNode(String(k))); }
  return n;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

};

/* ---------- order drill ---------- */
function viewOrder(root, m){
  let placed=0, mistakes=0, hint=false;
  const poolIdx = shuffle(m.order.map((_,i)=>i));
  const seqList=el('ol',{class:'seq'}), pool=el('div',{class:'pool'}), status=el('p',{class:'status'});
  const hintBtn=el('button',{class:'btn', type:'button', onclick:()=>{ hint=true; draw(); }}, '힌트: 다음 효소');
  const again=el('button',{class:'btn', type:'button', onclick:()=>{ root.replaceChildren(); viewOrder(root,m); }}, '다시 섞기');
  function draw(){
    seqList.replaceChildren();
    if(placed===0) seqList.append(el('li',{class:'empty'}, '오른쪽에서 출발 물질을 고르세요.'));
    for(let i=0;i<placed;i++){
      if(i>0) seqList.append(el('li',{class:'via'}, '↓ '+m.via[i-1]));
      const o=m.order[i];
      seqList.append(el('li',{class:'met'}, el('div',{class:'t'}, o.t), el('div',{class:'f'}, o.f)));
    }
    if(hint && placed>0 && placed<m.order.length) seqList.append(el('li',{class:'via'}, '↓ '+m.via[placed-1]+' …'));
    pool.replaceChildren();
    poolIdx.filter(i=>i>=placed).forEach(i=>{
      const o=m.order[i];
      const b=el('button',{class:'tok', type:'button', onclick:()=>{
        if(i===placed){ placed++; hint=false; draw(); }
        else { mistakes++; b.classList.add('shake'); setTimeout(()=>b.classList.remove('shake'),450); status.textContent=`틀린 선택 ${mistakes}회 · ${placed}/${m.order.length}`; }
      }}, el('span',{class:'t'}, o.t), el('span',{class:'f'}, o.f));
      pool.append(b);
    });
    const done = placed===m.order.length;
    status.className='status'+(done?' done':'');
    status.textContent = done? `완성. 틀린 선택 ${mistakes}회` : `틀린 선택 ${mistakes}회 · ${placed}/${m.order.length}`;
    hintBtn.hidden = done || placed===0;
    if(done){ const best=store.get('order:'+m.id,null); if(best==null||mistakes<best) store.set('order:'+m.id,mistakes); }
  }
  const best=store.get('order:'+m.id,null);
  root.append(
    el('div',{class:'toolbar'}, el('span',{class:'hint'}, `대사물을 반응 순서대로 누르세요. 맞으면 왼쪽에 쌓이고 사이에 효소가 나타납니다.${best!=null?` 최소 실수 기록 ${best}회.`:''}`)),
    el('div',{class:'order'},
      el('div',{class:'panel'}, el('h4',{}, '내가 만든 경로'), seqList, el('div',{class:'qnav'}, status)),
      el('div',{class:'panel'}, el('h4',{}, '남은 대사물'), pool, el('div',{class:'qnav'}, hintBtn, again))));
  draw();
}

/* ---------- quiz engine ---------- */
function runQuiz(root, items, key, limit){
  let order, idx, score;
  function start(){ order=shuffle(items.map((_,i)=>i)); if(limit) order=order.slice(0,limit); idx=0; score=0; draw(); }
  function draw(){
    root.replaceChildren();
    if(idx>=order.length){
      const best=Math.max(store.get(key,0), score); store.set(key,best);
      root.append(el('div',{class:'qcard result'},
        el('p',{class:'big'}, `${score} / ${order.length}`),
        el('p',{class:'muted'}, `이 세트 최고 기록 ${best} / ${order.length}`),
        el('div',{class:'qnav'}, el('button',{class:'btn primary', type:'button', onclick:start}, '다시 풀기'))));
      return;
    }
    const it=items[order[idx]];
    const choices=shuffle(it.opts.map((t,i)=>({t, ok:i===(it.a||0)})));
    const exp=el('div',{class:'explain', hidden:true});
    const next=el('button',{class:'btn primary', type:'button', hidden:true, onclick:()=>{ idx++; draw(); }}, idx===order.length-1?'결과 보기':'다음 문제');
    const list=el('div',{class:'opts'});
    let answered=false;
    choices.forEach((c,ci)=>{
      const b=el('button',{class:'opt', type:'button', onclick:()=>{
        if(answered) return; answered=true;
        if(c.ok) score++;
        [...list.children].forEach((bb,j)=>{ bb.disabled=true; if(choices[j].ok) bb.classList.add('ok'); });
        if(!c.ok) b.classList.add('bad');
        exp.replaceChildren(el('strong',{}, c.ok?'정답. ':'오답. '), it.ex);
        exp.classList.toggle('is-bad', !c.ok); exp.hidden=false; next.hidden=false; next.focus();
      }}, c.t);
      list.append(b);
    });
    root.append(el('div',{class:'qcard'},
      el('div',{class:'qmeta'}, el('span',{}, `${idx+1} / ${order.length}`), el('span',{}, `맞힌 수 ${score}`), it.tag? el('span',{class:'tag'}, it.tag):null),
      it.rx? el('p',{class:'rxq'}, it.rx):null,
      el('p',{class:'q'}, it.q), list, exp, el('div',{class:'qnav'}, next)));
  }
  start();
}
function stem(e){ const t=e.match(/^[A-Za-z0-9]+/); return (t?t[0]:e).slice(0,4).toUpperCase(); }
function enzymeItems(mods){
  const allNames=[...new Set(MODS.flatMap(reactions).map(s=>s.e))];
  return mods.flatMap(m=>reactions(m).map(st=>{
    const bad = n => n===st.e || stem(n)===stem(st.e);
    const same = shuffle([...new Set(reactions(m).map(x=>x.e))].filter(n=>!bad(n)));
    const other = shuffle(allNames.filter(n=>!bad(n) && !same.includes(n)));
    const d=[...same.slice(0,2), ...other].filter((v,i,a)=>a.indexOf(v)===i);
    const pick=[...d, ...same.slice(2)].filter((v,i,a)=>a.indexOf(v)===i).slice(0,3);
    return { rx:`${st.s}  →  ${st.p}`, q:'이 반응을 촉매하는 효소는?', opts:[st.e, ...pick], a:0,
      ex:`${st.e}${st.dom?' ('+st.dom+')':''}: ${st.ef}.${st.n?' '+st.n:''}`, tag:m.short };
  }));
}
function viewEnzyme(root, m){
  const items = m.id==='mix' ? enzymeItems(MODS.filter(x=>x.steps)) : enzymeItems([m]);
  const best=store.get('enz:'+m.id,null);
  root.append(el('div',{class:'toolbar'}, el('span',{class:'hint'}, `반응을 보고 효소를 고릅니다. 경로 지도와 곁가지 반응이 모두 나옵니다${m.id==='mix'?' (무작위 12문제)':''}.${best!=null?` 최고 기록 ${best}개.`:''}`)));
  const box=el('div',{}); root.append(box);
  runQuiz(box, items, 'enz:'+m.id, m.id==='mix'?12:0);
}
function viewQuiz(root, m){
  let items = m.quiz.map(q=>({...q, tag: m.id==='mix'?'연결':null}));
  if(m.id==='mix') items = [...items, ...MODS.filter(x=>x.id!=='mix').flatMap(x=>x.quiz.map(q=>({...q, tag:x.short})))];
  const best=store.get('quiz:'+m.id,null);
  root.append(el('div',{class:'toolbar'}, el('span',{class:'hint'}, `${m.id==='mix'?'연결 문제와 모든 경로 문제를 섞어 12문제를 냅니다.':'선택지는 매번 섞입니다.'}${best!=null?` 최고 기록 ${best}개.`:''}`)));
  const box=el('div',{}); root.append(box);
  runQuiz(box, items, 'quiz:'+m.id, m.id==='mix'?12:0);
}

    bonds:[['C6','N1'],['N1','C2'],['C2','N3'],['N3','C4'],['C4','C5'],['C5','C6'],['C5','N7'],['N7','C8'],['C8','N9'],['N9','C4']],
    extra: g=>{ g.append(sv('line',{class:'stub', x1:200.8, y1:155.4, x2:222, y2:196})); g.append(sv('text',{class:'lbl', x:200, y:214}, '리보스-5′-인산')); g.append(sv('line',{class:'stub', x1:110, y1:65, x2:110, y2:30})); g.append(sv('text',{class:'lbl', x:118, y:30}, '=O (IMP)')); }
  },
  pyr:{ view:'0 0 250 236', label:'UMP의 피리미딘 고리 (골격만 표시)',
    atoms:[
      {id:'N1', x:120, y:155, src:'asp', why:'2단계 ATCase: 아스파르트산의 아미노 질소. 5단계에서 이 질소에 리보스가 붙습니다.'},
      {id:'C2', x:76.7, y:130, src:'co2', why:'1단계 CPS2: 중탄산(HCO₃⁻)의 탄소가 카바모일인산의 카보닐 탄소가 됩니다.'},
      {id:'N3', x:76.7, y:80, src:'gln', why:'1단계 CPS2: 글루타민의 아미드 질소가 카바모일인산의 질소가 됩니다.'},
      {id:'C4', x:120, y:55, src:'asp', why:'2단계 ATCase: 아스파르트산의 곁사슬(β) 카복실 탄소.'},
      {id:'C5', x:163.3, y:80, src:'asp', why:'2단계 ATCase: 아스파르트산의 β-탄소.'},
      {id:'C6', x:163.3, y:130, src:'asp', why:'2단계 ATCase: 아스파르트산의 α-탄소. 여기 붙어 있던 α-카복실기는 6단계 ODC에서 CO₂로 떠납니다.'}
    ],
    bonds:[['N1','C2'],['C2','N3'],['N3','C4'],['C4','C5'],['C5','C6'],['C6','N1']],
    extra: g=>{ g.append(sv('line',{class:'stub', x1:120, y1:155, x2:120, y2:196})); g.append(sv('text',{class:'lbl', x:84, y:214}, '리보스-5′-인산')); }
  }
};
function viewAtoms(root, m){
  const R=RINGS[m.ring];
  const byId=Object.fromEntries(R.atoms.map(a=>[a.id,a]));
  let queue=shuffle(R.atoms.map(a=>a.id)), cur=0, right=0;
  const done=new Map();
  const svg=sv('svg',{viewBox:R.view, role:'img', 'aria-label':R.label});
  const g=sv('g',{}); svg.append(g);
  R.bonds.forEach(([a,b])=>g.append(sv('line',{class:'bond', x1:byId[a].x, y1:byId[a].y, x2:byId[b].x, y2:byId[b].y})));
  R.extra(g);
  const nodes={};
  R.atoms.forEach(a=>{
    const c=sv('circle',{cx:a.x, cy:a.y, r:16});
    const t=sv('text',{x:a.x, y:a.y+4.5, 'text-anchor':'middle'}, a.id);
    const gg=sv('g',{class:'atom', tabindex:'0', role:'button', 'aria-label':a.id},  c, t);
    gg.addEventListener('click',()=>{ if(done.has(a.id)) showWhy(a.id); else { cur=queue.indexOf(a.id); draw(); } });
    gg.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); gg.dispatchEvent(new Event('click')); } });
    nodes[a.id]={g:gg,c};
    g.append(gg);
  });
  const panel=el('div',{class:'atompanel'});
  const prompt=el('p',{class:'prompt'});
  const srcs=el('div',{class:'srcs'});
  const exp=el('div',{class:'explain', hidden:true});
  const status=el('p',{class:'status'});
  const ctrl=el('div',{class:'qnav'},
    el('button',{class:'btn', type:'button', onclick:()=>{ R.atoms.forEach(a=>done.set(a.id,true)); draw(); prompt.textContent='전체 지도입니다. 원자를 누르면 설명이 나옵니다.'; srcs.replaceChildren(); }}, '모두 보기'),
    el('button',{class:'btn', type:'button', onclick:()=>{ root.replaceChildren(); viewAtoms(root,m); }}, '다시 하기'));
  const legend=el('div',{class:'legend'}, Object.entries(SRC).map(([k,s])=>el('span',{}, el('i',{style:`background:var(${s.v})`}), s.t)));
  function paint(){
    R.atoms.forEach(a=>{
      const n=nodes[a.id]; const isDone=done.has(a.id);
      n.g.classList.toggle('done', isDone);
      n.g.classList.toggle('cur', !isDone && queue[cur]===a.id);
      n.c.style.fill = isDone? `var(${SRC[a.src].v})` : '';
    });
  }
  function showWhy(id){ const a=byId[id]; exp.className='explain'; exp.replaceChildren(el('strong',{}, `${id} ← ${SRC[a.src].t}. `), a.why); exp.hidden=false; }
  function nextOpen(){ const rest=queue.filter(id=>!done.has(id)); return rest.length? queue.indexOf(rest[0]) : -1; }
  function draw(){
    paint();
    const remaining=R.atoms.length-done.size;
    status.textContent = remaining? `맞힌 원자 ${right} · 남은 원자 ${remaining}` : `완료. ${R.atoms.length}개 중 첫 시도에 ${right}개 정답`;
    status.className='status'+(remaining?'':' done');
    if(!remaining){ prompt.textContent='고리 완성. 원자를 누르면 설명을 다시 볼 수 있습니다.'; srcs.replaceChildren(); return; }
    if(done.has(queue[cur])) cur=nextOpen();
    const id=queue[cur];
    prompt.replaceChildren('이 원자는 어디서 왔을까요? ', el('b',{}, id));
    srcs.replaceChildren();
    let tried=false;
    Object.entries(SRC).forEach(([k,s])=>{
      const b=el('button',{class:'src', type:'button', onclick:()=>{
        const a=byId[id];
        if(k===a.src){ if(!tried) right++; b.classList.add('ok'); done.set(id,true); [...srcs.children].forEach(x=>x.disabled=true); showWhy(id); setTimeout(draw, 650); paint(); }
        else { tried=true; b.classList.add('bad'); b.disabled=true; exp.className='explain is-bad'; exp.replaceChildren(el('strong',{}, '아닙니다. '), '다른 출처를 골라 보세요.'); exp.hidden=false; }
      }}, el('span',{class:'sw', style:`background:var(${s.v})`}), s.t);
      srcs.append(b);
    });
  }
  panel.append(prompt, srcs, exp, status, ctrl, legend);
  root.append(
    el('div',{class:'toolbar'}, el('span',{class:'hint'}, '강조된 원자의 출처를 고르세요. 원자를 직접 눌러 순서를 바꿀 수도 있습니다.')),
    el('div',{class:'atoms'}, el('div',{class:'ringbox'}, svg), panel));
  draw();
}

renderMods(); renderModule();
</script>
